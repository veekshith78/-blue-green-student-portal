global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "backend-blue"
    static_configs:
      - targets: ["backend-blue:5000"]
        labels:
          color: blue

  - job_name: "backend-green"
    static_configs:
      - targets: ["backend-green:5000"]
        labels:
          color: green

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
