{% extends "base.html" %}
{% block title %}Attendance{% endblock %}
{% block content %}
<h2>My Attendance</h2>
<table class="table table-striped mt-3">
  <thead><tr><th>Date</th><th>Status</th></tr></thead>
  <tbody>
    {% for r in records %}
    <tr>
      <td>{{ r.date }}</td>
      <td>
        {% if r.status == 'present' %}
          <span class="badge bg-success">Present</span>
        {% else %}
          <span class="badge bg-danger">Absent</span>
        {% endif %}
      </td>
    </tr>
    {% else %}
    <tr><td colspan="2" class="text-muted">No records yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
