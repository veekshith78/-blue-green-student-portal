{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h2>My Profile</h2>
<div class="card mt-3 shadow-sm" style="max-width: 480px;">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" value="{{ current_user.name }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
      </div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <input type="text" class="form-control" value="{{ current_user.role }}" disabled>
      </div>
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
