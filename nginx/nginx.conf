worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    # ------------------------------------------------------------------
    # ACTIVE_COLOR is the single line you change to flip live traffic.
    # It's included from a separate file so scripts/switch.sh can swap it
    # with `sed` and reload nginx without touching this main file.
    # ------------------------------------------------------------------
    include /etc/nginx/active_upstream.conf;

    server {
        listen 80;

        location /health {
            proxy_pass http://active_app/health;
        }

        location / {
            proxy_pass http://active_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Optional: a second listener that always shows you both colors side by
    # side for debugging (blue on 8081, green on 8082) - see docker-compose.
    server {
        listen 8081;
        location / {
            proxy_pass http://backend-blue:5000;
        }
    }

    server {
        listen 8082;
        location / {
            proxy_pass http://backend-green:5000;
        }
    }
}
