version: "3.9"

services:
  # ---------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: studentportal
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ---------------------------------------------------------------------
  # Application - BLUE (currently live / stable)
  # ---------------------------------------------------------------------
  backend-blue:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DEPLOYMENT_COLOR: blue
      APP_VERSION: "1.0.0"
      SECRET_KEY: change-this-in-production
      DATABASE_URL: postgresql://appuser:apppass@db:5432/studentportal
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  # ---------------------------------------------------------------------
  # Application - GREEN (new version being deployed / tested)
  # ---------------------------------------------------------------------
  backend-green:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DEPLOYMENT_COLOR: green
      APP_VERSION: "1.1.0"
      SECRET_KEY: change-this-in-production
      DATABASE_URL: postgresql://appuser:apppass@db:5432/studentportal
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  # ---------------------------------------------------------------------
  # Reverse proxy - single front door, points at whichever color is "active"
  # ---------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/active_upstream.conf:/etc/nginx/active_upstream.conf
    ports:
      - "8080:80"     # <- main entry point: http://localhost:8080
      - "8081:8081"   # <- always blue, for debugging
      - "8082:8082"   # <- always green, for debugging
    depends_on:
      - backend-blue
      - backend-green

  # ---------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend-blue
      - backend-green

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  db_data:
  grafana_data:
