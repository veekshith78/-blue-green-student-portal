version: "3.9"

# Run Jenkins itself in Docker. Separate from the main stack so you can
# start/stop CI independently of the running application.
#
# Usage:
#   docker compose -f jenkins/docker-compose.jenkins.yml up -d
#   Then open http://localhost:8090
#
# Note: this mounts the host's docker.sock so Jenkins can run `docker build`
# / `docker compose` commands against your local Docker daemon.
services:
  jenkins:
    image: jenkins/jenkins:lts
    user: root
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker

volumes:
  jenkins_home:
